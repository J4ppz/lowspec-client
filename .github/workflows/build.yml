name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download font
        run: |
          mkdir -p src/main/resources/assets/lowspec/font
          curl -fsSL -o src/main/resources/assets/lowspec/font/poppins.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Medium.ttf
      - name: Generate art (panorama, buttons, logo)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet numpy
          /tmp/venv/bin/python tools/gen_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lowspec-client-jar
          path: build/libs/*.jar
